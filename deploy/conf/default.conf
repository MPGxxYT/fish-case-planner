# Serves the build and forwards /api to the API container. Nginx Proxy
# Manager sits in front and handles HTTPS, so this only listens on plain
# HTTP inside the Docker network.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same limit as the API's own (MAX_BODY in api/app.js).
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://fish-case-planner-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html names the current bundle, so it's never cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed file names never change. A missing one is a 404, not index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
